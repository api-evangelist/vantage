    description: The Vantage Cost Management API (v2) provides programmatic access to cloud cost data and enables automation
      of cost management workflows. Create and manage Cost Reports, Folders, Dashboards, Saved Filters, Teams, Budgets, Anomaly
      Alerts, Business Metrics, Network Flow Reports, Financial Commitment Reports, Resource Reports, Segments, Integrations,
      and more. Supports the Vantage Query Language (VQL) for filtering cost data across multiple cloud providers.
    baseURL: https://api.vantage.sh/v2
