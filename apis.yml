  https://raw.githubusercontent.com/api-evangelist/vantage/refs/heads/main/apis.yml
apis:
  - aid: vantage:cost-management-api
    name: Vantage Cost Management API
    tags:
      - Cloud Costs
      - FinOps
      - Cost Reports
      - Budgets
      - Anomaly Detection
      - Dashboards
    humanURL: https://docs.vantage.sh/api
    properties:
      - url: https://vantage.readme.io/reference/general
        type: Documentation
      - url: openapi/vantage-cost-management-api-openapi.yml
        type: OpenAPI
      - url: https://api.vantage.sh/v2/oas_v3.json
        type: OpenAPI
      - url: https://api.vantage.sh/v2/swagger.json
        type: Swagger
    description: >-
      The Vantage Cost Management API (v2) provides programmatic access to cloud
      cost data and enables automation of cost management workflows. Create and
      manage Cost Reports, Folders, Dashboards, Saved Filters, Teams, Budgets,
      Anomaly Alerts, Business Metrics, Network Flow Reports, Financial
      Commitment Reports, Resource Reports, Segments, Integrations, and more.
      Supports the Vantage Query Language (VQL) for filtering cost data across
      multiple cloud providers.
    baseURL: https://api.vantage.sh/v2
  - aid: vantage:cloud-pricing-api
    name: Vantage Cloud Pricing API
    tags:
      - Cloud Pricing
      - Infrastructure Pricing
      - AWS
      - Azure
      - GCP
    humanURL: https://docs.vantage.sh/api
    properties:
      - url: https://vantage.readme.io/reference/general
        type: Documentation
      - url: openapi/vantage-cloud-pricing-api-openapi.yml
        type: OpenAPI
      - url: https://api.vantage.sh/v1/swagger.json
        type: Swagger
    description: >-
      The Vantage Cloud Pricing API (v1) provides programmatic access to cloud
      infrastructure pricing data across multiple providers including AWS, Azure,
      and GCP. Query providers, services, products, and prices to retrieve
      up-to-date pricing information for cloud infrastructure. The API is free
      for all registered Vantage users.
    baseURL: https://api.vantage.sh/v1
