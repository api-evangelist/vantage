          in: query
          type: string
          required: false
          description: The token of the Cost Report.
        - name: start_date
          in: query
          type: string
          required: false
          description: Start date (YYYY-MM-DD).
        - name: end_date
          in: query
          type: string
          required: false
          description: End date (YYYY-MM-DD).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
