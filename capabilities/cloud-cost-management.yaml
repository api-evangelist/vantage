              mapping: "$."

        - name: list-pricing-products
          description: "List cloud products with pricing."
          hints:
            readOnly: true
            openWorld: true
          call: "vantage-pricing.get-products"
          with:
            provider_id: "tools.provider_id"
            service_id: "tools.service_id"
            name: "tools.name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-pricing-product
          description: "Get a specific cloud product with pricing details."
          hints:
            readOnly: true
            openWorld: true
          call: "vantage-pricing.get-product"
          with:
            product_id: "tools.product_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-prices
          description: "Get pricing data filtered by product, provider, service, or region."
          hints:
            readOnly: true
            openWorld: true
          call: "vantage-pricing.get-prices"
          with:
            product_id: "tools.product_id"
            provider_id: "tools.provider_id"
            service_id: "tools.service_id"
            region: "tools.region"
          outputParameters:
            - type: object
              mapping: "$."
