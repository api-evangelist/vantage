    resources:
    - path: /v1/network-flow-reports
      name: network-flow-reports
      description: REST surface for network_flow_reports.
      operations:
      - method: GET
        name: getnetworkflowreports
        description: Vantage Get All Network Flow Reports
        call: cost-management-network-flow-reports.getnetworkflowreports
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnetworkflowreport
        description: Vantage Create a Network Flow Report
        call: cost-management-network-flow-reports.createnetworkflowreport
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/network-flow-reports/{network-flow-report-token}
      name: network-flow-reports-network-flow-report-token
      description: REST surface for network_flow_reports-network_flow_report_token.
      operations:
