    resources:
    - name: network_flow_reports
      path: /network_flow_reports
      operations:
      - name: getnetworkflowreports
        method: GET
        description: Vantage Get All Network Flow Reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnetworkflowreport
        method: POST
        description: Vantage Create a Network Flow Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
