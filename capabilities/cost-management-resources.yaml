naftiko: 1.0.0-alpha2
info:
  label: Vantage Cost Management API — Resources
  description: 'Vantage Cost Management API — Resources. 1 operations. Lead operation: Vantage Get Resources. Self-contained
    Naftiko capability covering one Vantage business surface.'
  tags:
  - Vantage
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VANTAGE_API_KEY: VANTAGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: cost-management-resources
    baseUri: https://api.vantage.sh/v2
    description: Vantage Cost Management API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: resources
      path: /resources
      operations:
      - name: getresources
        method: GET
        description: Vantage Get Resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resource_report_token
          in: query
          type: string
          description: The token of the Resource Report to retrieve resources for.
          required: true
    authentication:
      type: bearer
      token: '{{env.VANTAGE_API_KEY}}'
  exposes:
  - type: rest
    namespace: cost-management-resources-rest
    port: 8080
    description: REST adapter for Vantage Cost Management API — Resources. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/resources
      name: resources
      description: REST surface for resources.
      operations:
      - method: GET
        name: getresources
        description: Vantage Get Resources
        call: cost-management-resources.getresources
        with:
          resource_report_token: rest.resource_report_token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cost-management-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vantage Cost Management API — Resources. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: vantage-get-resources
      description: Vantage Get Resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cost-management-resources.getresources
      with:
        resource_report_token: tools.resource_report_token
      outputParameters:
      - type: object
        mapping: $.
