naftiko: "1.0.0-alpha1"

info:
  label: "Vantage Cloud Pricing API"
  description: "Programmatic access to cloud infrastructure pricing data across multiple providers including AWS, Azure, and GCP."
  tags:
    - Cloud Pricing
    - AWS
    - Azure
    - GCP
    - Infrastructure Pricing
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      VANTAGE_API_TOKEN: VANTAGE_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: vantage-pricing
      baseUri: https://api.vantage.sh/v1
      description: "Vantage Cloud Pricing API v1 for querying cloud infrastructure pricing data."
      authentication:
        type: bearer
        token: "{{VANTAGE_API_TOKEN}}"
      resources:
        - name: providers
          path: /providers
          description: "Retrieve available cloud providers."
          operations:
            - name: get-providers
              method: GET
              description: "Returns all supported cloud Providers."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "The page of results to return."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "The number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-provider
              method: GET
              description: "Returns a specific cloud Provider by identifier."
              inputParameters:
                - name: provider_id
                  in: path
                  type: string
                  required: true
                  description: "The identifier of the cloud provider."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: services
          path: /services
          description: "Retrieve cloud services and their details."
          operations:
            - name: get-services
              method: GET
              description: "Returns all Services across Providers."
              inputParameters:
                - name: provider_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by provider identifier."
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "The page of results to return."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "The number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-service
              method: GET
              description: "Returns a specific Service by identifier."
              inputParameters:
                - name: service_id
                  in: path
                  type: string
                  required: true
                  description: "The identifier of the service."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: products
          path: /products
          description: "Query cloud infrastructure products and pricing."
          operations:
            - name: get-products
              method: GET
              description: "Returns all Products for a given Provider and Service."
              inputParameters:
                - name: provider_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by provider identifier."
                - name: service_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by service identifier."
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Filter by product name."
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "The page of results to return."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "The number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-product
              method: GET
              description: "Returns a specific Product with pricing details."
              inputParameters:
                - name: product_id
                  in: path
                  type: string
                  required: true
                  description: "The identifier of the product."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: prices
          path: /prices
          description: "Retrieve pricing details for products."
          operations:
            - name: get-prices
              method: GET
              description: "Returns pricing data filtered by product, provider, service, or region."
              inputParameters:
                - name: product_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by product identifier."
                - name: provider_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by provider identifier."
                - name: service_id
                  in: query
                  type: string
                  required: false
                  description: "Filter by service identifier."
                - name: region
                  in: query
                  type: string
                  required: false
                  description: "Filter by cloud region."
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "The page of results to return."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "The number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: vantage-pricing-rest
      resources: []

    - type: mcp
      port: 9101
      namespace: vantage-pricing-mcp
      transport: http
      tools: []
