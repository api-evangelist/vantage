naftiko: "1.0.0-alpha1"

info:
  label: "Vantage Cost Management API"
  description: "Programmatic access to cloud cost data and automation of cost management workflows including Cost Reports, Dashboards, Budgets, Anomaly Alerts, Business Metrics, and more."
  tags:
    - Cloud Costs
    - FinOps
    - Cost Management
    - Budgets
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      VANTAGE_API_TOKEN: VANTAGE_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: vantage-cost-mgmt
      baseUri: https://api.vantage.sh/v2
      description: "Vantage Cost Management API v2 for managing cloud cost data and workflows."
      authentication:
        type: bearer
        token: "{{VANTAGE_API_TOKEN}}"
      resources:
        - name: cost-reports
          path: /cost_reports
          description: "Create, read, update, and delete Cost Reports."
          operations:
            - name: get-cost-reports
              method: GET
              description: "Returns all Cost Reports."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "The page of results to return."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "The number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-cost-report
              method: POST
              description: "Creates a new Cost Report."
              inputParameters:
                - name: title
                  in: body
                  type: string
                  required: true
                  description: "Title of the cost report."
                - name: filter
                  in: body
                  type: string
                  required: false
                  description: "VQL filter expression."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  filter: "{{tools.filter}}"
            - name: get-cost-report
              method: GET
              description: "Returns a specific Cost Report by token."
              inputParameters:
                - name: cost_report_token
                  in: path
                  type: string
                  required: true
                  description: "The token of the Cost Report."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-cost-report
              method: PUT
              description: "Updates an existing Cost Report."
              inputParameters:
                - name: cost_report_token
                  in: path
                  type: string
                  required: true
                  description: "The token of the Cost Report."
                - name: title
                  in: body
                  type: string
                  required: false
                  description: "Updated title."
                - name: filter
                  in: body
                  type: string
                  required: false
                  description: "Updated VQL filter."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  title: "{{tools.title}}"
                  filter: "{{tools.filter}}"
            - name: delete-cost-report
              method: DELETE
              description: "Deletes an existing Cost Report."
              inputParameters:
                - name: cost_report_token
                  in: path
                  type: string
                  required: true
                  description: "The token of the Cost Report."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: costs
          path: /costs
          description: "Retrieve cost data."
          operations:
            - name: get-costs
              method: GET
              description: "Returns all Costs for a CostReport or VQL filter."
              inputParameters:
                - name: cost_report_token
                  in: query
                  type: string
                  required: false
                  description: "The token of the Cost Report."
                - name: start_date
                  in: query
                  type: string
                  required: false
                  description: "Start date (YYYY-MM-DD)."
                - name: end_date
                  in: query
                  type: string
                  required: false
                  description: "End date (YYYY-MM-DD)."
